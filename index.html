<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jugá con Martín – Lógica Computacional</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== PANTALLA INICIO ===== -->
  <div id="screen-start" class="screen active">
    <div class="start-card">
      <div class="start-logo">🇦🇷</div>
      <h1 class="start-title">Jugá con Martín</h1>
      <p class="start-sub">IES9008 Manuel Belgrano</p>
      <p class="start-course">Lógica Computacional</p>
      <button id="btn-play" class="btn btn-primary btn-big">▶ Jugar</button>

      <!-- Botones de contacto 3D -->
      <div class="contact-buttons">
        <a href="https://www.instagram.com/vega.martin1?igsh=Y2o2enl2NzB3M3Q4"
           target="_blank" rel="noopener" class="btn-3d btn-instagram">
          <span class="btn-3d-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
              <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
            </svg>
          </span>
          Instagram
        </a>
        <a href="https://wa.me/5492615776160" target="_blank" rel="noopener"
           class="btn-3d btn-whatsapp">
          <span class="btn-3d-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
              <path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.932-1.408A9.955 9.955 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.946 7.946 0 01-4.073-1.117l-.292-.173-3.026.864.864-3.026-.174-.292A7.946 7.946 0 014 12c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8z"/>
            </svg>
          </span>
          WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- ===== PANTALLA JUEGO ===== -->
  <div id="screen-game" class="screen">
    <!-- Barra superior -->
    <header class="game-header">
      <div class="header-left">
        <span class="level-badge" id="level-badge">Nivel 1</span>
      </div>
      <div class="header-center">
        <span class="course-tag">Lógica Computacional</span>
      </div>
      <div class="header-right">
        <span class="score-display">⭐ <span id="score">0</span></span>
      </div>
    </header>

    <!-- Barra de navegación secundaria -->
    <div class="nav-bar">
      <button id="btn-prev" class="btn btn-nav" title="Volver al anterior">← Anterior</button>
      <button id="btn-exit" class="btn btn-exit" title="Salir al inicio">✕ Salir</button>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-bar-wrap">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <span class="progress-label" id="progress-label">0 / 0</span>
    </div>

    <!-- Contenido principal -->
    <main class="game-main">

      <!-- TARJETA DEFINICIÓN -->
      <div id="card-definition" class="card card-def hidden">
        <div class="card-type-badge">📖 Concepto</div>
        <h2 class="def-title" id="def-title"></h2>
        <div class="def-body" id="def-body"></div>
        <button id="btn-continue-def" class="btn btn-continue">Continuar →</button>
      </div>

      <!-- TARJETA PREGUNTA -->
      <div id="card-question" class="card card-q hidden">
        <div class="card-type-badge" id="q-type-badge">❓ Pregunta</div>
        <p class="q-number" id="q-number"></p>
        <h3 class="q-text" id="q-text"></h3>
        <div class="options-grid" id="options-grid"></div>

        <!-- Justificación (segunda capa) -->
        <div id="justification-wrap" class="hidden">
          <p class="just-label">¿Por qué es correcta esa respuesta?</p>
          <div class="options-grid" id="just-options-grid"></div>
        </div>

        <button id="btn-continue-q" class="btn btn-continue hidden">Continuar →</button>
      </div>

      <!-- TARJETA REPASO ACUMULATIVO -->
      <div id="card-review" class="card card-review hidden">
        <div class="card-type-badge">🔄 Mini Repaso</div>
        <h3 class="review-title" id="review-title"></h3>
        <div class="review-items" id="review-items"></div>
        <button id="btn-continue-review" class="btn btn-continue">Continuar →</button>
      </div>

      <!-- TARJETA FIN DE JUEGO -->
      <div id="card-end" class="card card-end hidden">
        <div class="end-emoji">🐷</div>
        <h2>¡Juego completado!</h2>
        <p class="end-score">Puntuación final: <strong id="final-score">0</strong></p>
        <p class="end-msg" id="end-msg"></p>
        <button id="btn-restart" class="btn btn-primary">Jugar de nuevo</button>
      </div>

    </main>
  </div>

  <!-- ===== POPUP FEEDBACK ===== -->
  <div id="popup" class="popup hidden">
    <div class="popup-inner" id="popup-inner">
      <p class="popup-text" id="popup-text"></p>
    </div>
  </div>

  <!-- AUDIO (Web Audio API — generado por JS) -->

  <script src="script.js"></script>
</body>
</html>
